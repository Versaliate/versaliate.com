<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Versalox | Versaliate</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1d2a44 0%, #090d16 55%, #05070d 100%);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
    }

    main {
      max-width: 760px;
      padding: 32px;
    }

    .eyebrow {
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #9fb4ff;
      font-size: 14px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: clamp(48px, 10vw, 96px);
      margin: 0 0 16px;
      line-height: 1;
    }

    p {
      font-size: 20px;
      color: #c9d3e8;
      line-height: 1.6;
      margin: 0 auto 28px;
    }

    .button {
      display: inline-block;
      padding: 14px 22px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      color: white;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }

    .button:hover {
      background: rgba(255, 255, 255, 0.14);
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">Versaliate presents</div>
    <h1>Versalox</h1>
    <p>
      Die offizielle Website von Versalox entsteht gerade.
      Weitere Informationen, Screenshots und Updates folgen bald.
    </p>
    <a class="button" href="mailto:contact@versaliate.com">Kontakt aufnehmen</a>
  </main>
</body>
</html>
